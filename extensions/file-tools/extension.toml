id = "file-tools"
name = "File Tools"
version = "0.2.4"
author = "Atlas Team"
description = "Resize images, convert media, and compress PDFs using local tools"
kind = "declarative"

[[commands]]
id = "resize-image"
title = "Resize image…"
requires = ["magick"]
per_file = true
accepts = { extensions = ["jpg", "jpeg", "png", "webp", "gif", "bmp", "tiff"] }
run = "magick {input} -resize {prompt:width}x {dir}/{stem}_resized.{ext}"

[[commands.prompts]]
name = "width"
label = "Width in pixels"
default = "1920"

[[commands]]
id = "image-to-png"
title = "Convert image to PNG"
requires = ["magick"]
per_file = true
accepts = { extensions = ["jpg", "jpeg", "webp", "gif", "bmp", "tiff", "heic"] }
run = "magick {input} {dir}/{stem}.png"

[[commands]]
id = "compress-pdf"
title = "Compress PDF"
requires = ["gs"]
per_file = true
accepts = { extensions = ["pdf"] }
run = "gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/ebook -dNOPAUSE -dQUIET -dBATCH -sOutputFile={dir}/{stem}_compressed.pdf {input}"

[[commands]]
id = "video-to-mp4"
title = "Convert video to MP4 (H.264)"
requires = ["ffmpeg"]
per_file = true
accepts = { extensions = ["mkv", "avi", "mov", "webm", "flv", "wmv"] }
run = "ffmpeg -i {input} -c:v libx264 -crf {prompt:crf} -c:a aac -y {dir}/{stem}.mp4"

[[commands.prompts]]
name = "crf"
label = "Quality (18 high, 23 medium, 28 low)"
default = "23"
