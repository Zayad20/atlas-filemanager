id = "file-tools"
name = "File Tools"
version = "0.2.0"
author = "Atlas Team"
description = "Resize images, convert media, and compress PDFs using local tools"
kind = "wasm"
wasm_module = "plugin.wasm"

[[commands]]
id = "resize-image"
title = "Resize image…"
requires = ["magick"]
per_file = true
accepts = { extensions = ["jpg", "jpeg", "png", "webp", "gif", "bmp", "tiff"] }

[[commands]]
id = "image-to-png"
title = "Convert image to PNG"
requires = ["magick"]
per_file = true
accepts = { extensions = ["jpg", "jpeg", "webp", "gif", "bmp", "tiff", "heic"] }

[[commands]]
id = "compress-pdf"
title = "Compress PDF"
requires = ["gs"]
per_file = true
accepts = { extensions = ["pdf"] }

[[commands]]
id = "video-to-mp4"
title = "Convert video to MP4 (H.264)"
requires = ["ffmpeg"]
per_file = true
accepts = { extensions = ["mkv", "avi", "mov", "webm", "flv", "wmv"] }
