[package]
name = "atlas"
version = "0.1.0"
edition = "2021"
default-run = "atlas"

[workspace]
members = [
    ".",
    "crates/atlas-model",
    "crates/atlas-core",
    "crates/atlas-ui", "crates/atlas-wasm-icon-theme",
    "crates/atlas-wasm-file-tools",
    "crates/atlas-publisher",
]
resolver = "2"

[workspace.dependencies]
atlas-model = { path = "crates/atlas-model" }
atlas-core = { path = "crates/atlas-core" }
atlas-ui = { path = "crates/atlas-ui" }
anyhow = "1"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "time", "process"] }
tracing = "0.1.44"
rust-i18n = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
option_if_let_else = "allow"
needless_pass_by_ref_mut = "allow"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
# Library crates expose internal modules as "public API", surfacing doc/field
# pedantic lints that the binary suppresses. These are internal atlas-* crates,
# not a published API, so the noise isn't worth churn.
too_long_first_doc_paragraph = "allow"
pub_underscore_fields = "allow"
implicit_hasher = "allow"
new_without_default = "allow"

# Bundle metadata for `cargo bundle` (cargo install cargo-bundle).
# Produces a macOS .app / Linux .deb with the icon and identifier below.
# The folder "Open With" association is injected per-OS from the packaging/ manifests.
[package.metadata.bundle]
name = "Atlas"
identifier = "com.atlas.Atlas"
short_description = "Modern cross-platform file manager"
category = "Utility"
# icon = ["packaging/icons/atlas.icns", "packaging/icons/atlas.ico"]

# `kamadak-exif` exposes its crate as `exif` (used in fs/preview.rs); cargo-machete
# matches by package name and reports a false positive — ignore it.
[package.metadata.cargo-machete]
ignored = ["kamadak-exif"]

[features]
default = ["cloud", "rar"]
# Cloud / network mounting extension. Forwards to the UI crate (which forwards to
# atlas-core/atlas-model); the heavy HTTP/TLS/crypto deps live in `atlas-core`.
cloud = ["atlas-ui/cloud"]
# RAR archive navigation via bundled UnRAR.exe CLI.
rar = ["atlas-ui/rar"]

[dependencies]
# FASE J: the whole gpui application layer (App entity, views, overlays, input,
# platform glue) lives in `atlas-ui`. This binary is a thin launcher over
# `atlas_ui::run`. Backends/state live in atlas-core/atlas-model (transitive).
atlas-ui = { workspace = true }

tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "time", "process"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# Estricto total: grupos a deny con priority -1 para que los ajustes puntuales
# de abajo puedan rebajarlos. unwrap/expect quedan en warn (restriction, no en
# los grupos). I/O síncrona de filesystem está prohibida vía clippy.toml.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Ruido aceptado en una app GUI: módulos planos y futuros que sí queremos.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Matemática de píxeles/tamaños/física: los casts numéricos son ubicuos y benignos
# en una GUI; vetarlos solo añade `as` con anotaciones que no aportan seguridad.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Era-migración: estos rebajan churn de firmas/nursery frágil mientras el código
# se mueve a los crates atlas-* (Fase F). Revisar y re-activar tras el split.
#   - nursery con falsos positivos en código con forma de framework (gpui):
option_if_let_else = "allow"
needless_pass_by_ref_mut = "allow"
#   - cambiar estas firmas ripplea a los call-sites; se estabilizan en el split:
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
# Las funciones de render gpui son declarativas y largas por naturaleza.
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"

[profile.dev]
opt-level = 1
codegen-units = 16

# Build all dependencies optimized even in debug.
# Our own crate stays at opt-level 1 for fast incremental rebuilds, but the
# heavy rendering/decoding deps run at full speed — this is what keeps the dev
# build feeling smooth.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Local fork of gpui-component (rev b2472cd) with the Dock TabPanel patched to render
# segmented (pill) tabs — matches the Figma "Tab selector". Redirects every git
# reference to that repo so there's a single source (avoids duplicate gpui App types).
[patch."https://github.com/longbridge/gpui-component"]
gpui-component = { path = "C:/Users/user/developer/gpui-component-fork/crates/ui" }
gpui-component-assets = { path = "C:/Users/user/developer/gpui-component-fork/crates/assets" }
gpui-component-macros = { path = "C:/Users/user/developer/gpui-component-fork/crates/macros" }

# Local GPUI fork at Cargo.lock's pinned Zed commit (95dfe8c), patched with
# paint-only offsets so pane FLIP animations do not mutate layout each frame.
[patch."https://github.com/zed-industries/zed"]
gpui = { path = "C:/Users/user/developer/zed-reference/crates/gpui" }
gpui_platform = { path = "C:/Users/user/developer/zed-reference/crates/gpui_platform" }
