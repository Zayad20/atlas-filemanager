[package]
name = "egui-app"
version = "0.1.0"
edition = "2021"

# Bundle metadata for `cargo bundle` (cargo install cargo-bundle).
# Produces a macOS .app / Linux .deb with the icon and identifier below.
# The folder "Open With" association is injected per-OS from the packaging/ manifests.
[package.metadata.bundle]
name = "Atlas"
identifier = "com.Atlas.Atlas"
short_description = "Modern cross-platform file manager"
category = "Utility"
# icon = ["packaging/icons/Atlas.icns", "packaging/icons/Atlas.ico"]

[features]
default = ["cloud"]
# Cloud / network mounting extension. Gated so the core binary can be built
# without the heavier HTTP/TLS/crypto deps (`cargo build --no-default-features`).
# The rclone binary itself is NOT bundled — it is downloaded on demand at runtime.
cloud = ["dep:reqwest", "dep:async-trait", "dep:sha2", "dep:futures-util"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = [
    "default_fonts", "glow", "wayland", "x11", "persistence",
]}
egui = { version = "0.33", default-features = false }
egui_extras = { version = "0.33", features = ["all_loaders"] }
egui_tiles = "0.14"
egui_commonmark = "0.22"
egui-phosphor = "=0.11.0"

# --- gpui (renderer) ----------------------------------------------------------
# gpui MUST be declared with the SAME source spec as gpui-component's transitive
# dep (bare git, no `rev`), or cargo treats `?rev=…` and the bare source as two
# distinct packages → two `App` types that don't unify. The commit is pinned by
# Cargo.lock (currently ade2b21); commit the lock and don't `cargo update` blindly.
gpui = { git = "https://github.com/zed-industries/zed" }
# Platform layer for gpui: `gpui_platform::application()` is the official entry
# point in this rev (replaces `Application::new()`). Same bare-git zed source +
# the platform features gpui-component itself enables, so cargo unifies the rev.
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "b2472cd798422b05e2448d07aaab1550c21155f7" }
# Default icon/asset pack from the gpui-component repo (crates/assets), pinned to
# the SAME rev so the asset paths match the widget set.
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "b2472cd798422b05e2448d07aaab1550c21155f7" }

tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros", "time", "process"] }
flume = "0.11"
# gpui's async executor uses smol; `smol::Timer` drives the BgResult drain loop.
smol = "2"
rayon = "1"
nucleo = "0.5"
notify = "6"
notify-debouncer-mini = "0.4"

# Phase 5 — pinned to avoid fancy-regex gap (5.3 requires ^0.16.2 which doesn't exist)
syntect = { version = ">=5.0, <5.3", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp", "ico"] }
kamadak-exif = "0.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
open = "5"
trash = "5"
arboard = "3"
rfd = "0.15"
zip = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
jwalk = "0.8.1"
anyhow = "1"
thiserror = "2"
once_cell = "1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sysinfo = "0.38.4"

# --- cloud feature (optional) -------------------------------------------------
# reqwest with rustls (no system OpenSSL) for the rclone rc HTTP API + binary download.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
async-trait = { version = "0.1", optional = true }
sha2 = { version = "0.10", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false, features = ["x11"] }
x11rb = "0.13"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
drag = "2.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Com",
]}

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSData"] }
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSImage"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[[bin]]
name = "spike"
path = "src/bin/spike.rs"
required-features = ["spike"]

[profile.dev]
opt-level = 1
codegen-units = 16

# Build all dependencies (egui, image, syntect, …) optimized even in debug.
# Our own crate stays at opt-level 1 for fast incremental rebuilds, but the
# heavy rendering/decoding deps run at full speed — this is what keeps the dev
# build feeling smooth (egui debug builds are otherwise very sluggish).
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
