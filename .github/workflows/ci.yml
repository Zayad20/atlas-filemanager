name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt

      - name: Format
        run: cargo fmt --check

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            clang g++ pkg-config libasound2-dev libfontconfig-dev libssl-dev libvulkan-dev \
            libxcb1-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libbz2-dev liblzma-dev \
            ffmpeg

      - name: Build
        run: cargo build --workspace --locked

      - name: Artifact packaging tests
        run: python -m unittest discover -s scripts/tests -p 'test_ci_archive.py'

      - name: CLI startup
        run: ./target/debug/atlas --version

      - name: Test
        env:
          # rust-i18n's generated translation initializer exceeds the default
          # test-thread stack in debug builds. Match Atlas's 16 MiB UI stack.
          RUST_MIN_STACK: '16777216'
        run: cargo test --workspace --locked --no-fail-fast

      - name: Stage Windows redistributable runtime
        if: runner.os == 'Windows'
        run: ./scripts/stage-windows-runtime.ps1

      - name: Archive development binaries
        run: python scripts/stage-ci-build.py

      - name: Downloadable development build
        uses: actions/upload-artifact@v4
        with:
          name: atlas-dev-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: target/ci-dist/*
          if-no-files-found: error
          retention-days: 14
