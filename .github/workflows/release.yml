name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v; must have CHANGELOG.md notes
        required: true
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atlas-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and release notes
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          python3 scripts/linux_release.py metadata --version "$version"
          prerelease=false
          if [[ "$version" == *-* || "$INPUT_PRERELEASE" == true ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: metadata
    runs-on: windows-latest
    env:
      ATLAS_VERSION: ${{ needs.metadata.outputs.version }}
      ATLAS_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -Version "$env:ATLAS_VERSION"
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/installer/AtlasSetup-$env:ATLAS_VERSION.exe" "dist/AtlasSetup-$env:ATLAS_VERSION.exe"
          Get-FileHash "dist/AtlasSetup-$env:ATLAS_VERSION.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  AtlasSetup-$env:ATLAS_VERSION.exe" } |
            Set-Content "dist/AtlasSetup-$env:ATLAS_VERSION.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-windows-x86_64
          path: dist/*
          if-no-files-found: error

  linux:
    needs: metadata
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ needs.metadata.outputs.version }}

  publish:
    name: Publish verified GitHub release
    runs-on: ubuntu-24.04
    needs: [metadata, windows, linux]
    env:
      ATLAS_VERSION: ${{ needs.metadata.outputs.version }}
      ATLAS_TAG: ${{ needs.metadata.outputs.tag }}
      ATLAS_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-*
          path: dist
          merge-multiple: true
      - name: Final checksums and release notes
        run: |
          python3 scripts/linux_release.py metadata --version "$ATLAS_VERSION"
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from linux_release import write_checksums
          write_checksums(Path('dist'))
          PY
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Create and publish a draft after all Linux checks pass
        run: |
          flags=()
          if [ "$ATLAS_PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$ATLAS_TAG" --json isDraft > /tmp/atlas-existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          if not json.load(open('/tmp/atlas-existing-release.json'))['isDraft']:
              raise SystemExit('A published release must not be overwritten; use a new version')
          PY
          else
            gh release create "$ATLAS_TAG" --draft --target "$GITHUB_SHA" \
              --title "Atlas $ATLAS_VERSION" --notes-file target/linux-release/release-notes.md "${flags[@]}"
          fi
          gh release upload "$ATLAS_TAG" dist/* --clobber
          gh release edit "$ATLAS_TAG" --draft=false --notes-file target/linux-release/release-notes.md "${flags[@]}"

  repositories:
    needs: [metadata, publish]
    if: ${{ vars.ATLAS_LINUX_REPOSITORIES_ENABLED == 'true' && needs.metadata.outputs.prerelease == 'false' }}
    uses: ./.github/workflows/linux-repositories.yml
    with:
      tag: ${{ needs.metadata.outputs.tag }}
    secrets: inherit
