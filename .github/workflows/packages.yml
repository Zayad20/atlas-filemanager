name: Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version present in CHANGELOG.md (does not publish a release)
        required: true
        default: '0.1.5'
      edition:
        description: Windows edition (free for Store baseline, full for unrestricted builds)
        type: choice
        options: [full, free]
        default: full
      platform:
        description: Platforms to package
        type: choice
        options: [both, windows, linux]
        default: both

permissions:
  contents: read

jobs:
  windows:
    if: inputs.platform != 'linux'
    uses: ./.github/workflows/windows-packages.yml
    with:
      version: ${{ inputs.version }}
      edition: ${{ inputs.edition }}
  linux:
    if: inputs.platform != 'windows'
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ inputs.version }}
