name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What did you expect instead? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Atlas version, placeholder: "e.g. 0.1.1" }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: Windows version, placeholder: "e.g. Windows 11 23H2" }
