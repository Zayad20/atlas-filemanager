[package]
name = "atlas-wasm-icon-theme"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = { version = "1.1", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.1.3", default-features = false, features = ["deflate"] }
