[package]
name = "atlas-win-space"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys-copy = { package = "windows-sys", version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
