[package]
name = "atlas-wasm-file-tools"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]
# wasm-only crate: the host linker can't resolve extism-pdk imports, so the
# workspace-wide `cargo test` must not build a host test harness for it.
test = false
doctest = false

[dependencies]
extism-pdk = { version = "1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
